# @package _global_
defaults: []

experiment:
  name: resnet_unet_baseline
  seed: 42

data:
  train_csv: ${oc.env:DEPTH_FUSION_ROOT,dataset_fusion}/train.csv
  val_csv: ${oc.env:DEPTH_FUSION_ROOT,dataset_fusion}/val.csv
  batch_size: 8
  num_workers: 4
  image_size: [256, 256]
  use_sensor_depth: false

model:
  name: resnet_unet  # resnet_unet | asaf_net
  backbone: resnet34
  pretrained: true
  in_channels: 4

train:
  epochs: 60
  lr: 1.0e-4
  checkpoint_dir: checkpoints/experiments/${experiment.name}
  log_csv: ${train.checkpoint_dir}/train_log.csv
  resume: ""
  use_wandb: false
  use_tensorboard: true

loss:
  w_l1: 1.0
  w_grad: 0.5
  w_ssim: 0.2
  w_smooth: 0.1
  w_normal: 0.1
  w_scale: 0.05

eval:
  min_depth: 0.001
  max_depth: 10000.0
  align_median: true
