[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "depth-fusion"
version = "0.1.0"
description = "RGB-D depth refinement for SLAM and 3D Gaussian Splatting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "torchvision>=0.15",
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "tqdm>=4.65",
  "scikit-image>=0.21",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "omegaconf>=2.3",
  "hydra-core>=1.3",
  "tensorboard>=2.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["depth_fusion*"]
